[package]
name = "sshnav"
version = "0.1.3"
edition = "2024"
license = "MIT"
description = "A fast local SSH inventory navigator and launcher."
repository = "https://github.com/Vulcanite/sshnav"

[dependencies]
anyhow = "1"
argon2 = "0.5"
chacha20poly1305 = "0.10"
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
crossterm = "0.29"
directories = "6"
fuzzy-matcher = "0.3"
rand_core = { version = "0.6", features = ["getrandom"] }
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm_0_29"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
zeroize = "1"

[dev-dependencies]
