name: Packages and Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  linux-packages:
    name: Linux packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends dpkg-dev rpm pkg-config libdbus-1-dev

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --all-features --locked

      - name: Validate release tag matches Cargo version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          cargo_version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)"
          test "v$cargo_version" = "${{ github.ref_name }}"

      - name: Build release binary
        run: cargo build --release --locked

      - name: Build Debian package
        run: packaging/deb/build-deb.sh

      - name: Build RPM package
        run: packaging/rpm/build-rpm.sh

      - name: Upload package artifact
        uses: actions/upload-artifact@v7
        with:
          name: sshnav-linux-packages
          path: |
            dist/*.deb
            dist/*.rpm
          if-no-files-found: error

      - name: Upload package to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.deb dist/*.rpm --clobber
          else
            gh release create "$TAG" dist/*.deb dist/*.rpm --title "$TAG" --notes "Release $TAG"
          fi

  changelog:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: linux-packages
    uses: ./.github/workflows/copilot-changelog.yml
    with:
      release_tag: ${{ github.ref_name }}
    secrets: inherit
